name: Platform quality checks

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Static, backend and browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Check static pages and Cloud Lab
        run: npm run test:site
      - name: Test backend validation and password handling
        run: npm run test:unit
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Test browser navigation
        run: npm run test:e2e
