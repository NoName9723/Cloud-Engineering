name: Lighthouse performance audit

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '**.html'
      - '**.css'
      - '**.js'
      - 'assets/**'
      - '.lighthouserc.json'
      - '.github/workflows/lighthouse.yml'

permissions:
  contents: read

jobs:
  lighthouse:
    name: Lighthouse baseline
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26

      - name: Run Lighthouse
        run: npx --yes @lhci/cli@0.15.1 autorun

      - name: Debug Lighthouse report files
        if: always()
        run: |
          echo "Current directory:"
          pwd

          echo "Repository files:"
          ls -la

          echo "Lighthouse files:"
          find . -type f \( -name "*.html" -o -name "*.json" \) | grep -i lighthouse || true

          echo "Lighthouse directory:"
          find . -type d -name "*lighthouse*" || true

          echo "Full .lighthouseci content:"
          if [ -d ".lighthouseci" ]; then
            find .lighthouseci -maxdepth 5 -print
          else
            echo ".lighthouseci directory does not exist"
          fi

      - name: Upload Lighthouse reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-reports
          path: |
            .lighthouseci/**
            **/lighthouse-report*.html
            **/lighthouse-report*.json
          if-no-files-found: warn
