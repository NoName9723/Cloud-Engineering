<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">Cloud operations dashboard</title><desc id="desc">Conceptual operations console showing healthy cloud services, compute nodes, metrics and observability.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#142b45"/><stop offset="1" stop-color="#0b1726"/></linearGradient><linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#203b59"/><stop offset="1" stop-color="#162d47"/></linearGradient><pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#91b9e5" stroke-opacity=".06"/></pattern></defs>
<rect width="1200" height="760" rx="24" fill="url(#bg)"/><rect width="1200" height="760" rx="24" fill="url(#grid)"/>
<text x="70" y="75" fill="#80b5ed" font-family="Arial,sans-serif" font-size="17" letter-spacing="4" font-weight="700">NEXORA / OPERATIONS CENTER</text><text x="70" y="119" fill="#eff6ff" font-family="Arial,sans-serif" font-size="31" font-weight="700">Cloud service overview</text>
<rect x="940" y="62" width="190" height="42" rx="21" fill="#173d38" stroke="#327968"/><circle cx="965" cy="83" r="6" fill="#4bd19d"/><text x="984" y="89" fill="#bdf5df" font-family="Arial,sans-serif" font-size="14">ALL SYSTEMS OK</text>
<!-- KPI panels -->
<g><rect x="70" y="165" width="330" height="135" rx="13" fill="url(#panel)" stroke="#355878"/><text x="98" y="202" fill="#9bb6d1" font-family="Arial,sans-serif" font-size="15">CLUSTER HEALTH</text><text x="98" y="254" fill="#63d6a8" font-family="Arial,sans-serif" font-size="34" font-weight="700">Operational</text><text x="98" y="280" fill="#8ea9c4" font-family="Arial,sans-serif" font-size="13">12 nodes · 4 services</text></g>
<g><rect x="435" y="165" width="330" height="135" rx="13" fill="url(#panel)" stroke="#355878"/><text x="463" y="202" fill="#9bb6d1" font-family="Arial,sans-serif" font-size="15">API LATENCY</text><text x="463" y="254" fill="#eff6ff" font-family="Arial,sans-serif" font-size="36" font-weight="700">42 ms</text><text x="463" y="280" fill="#8ea9c4" font-family="Arial,sans-serif" font-size="13">p95 · Last 15 minutes</text></g>
<g><rect x="800" y="165" width="330" height="135" rx="13" fill="url(#panel)" stroke="#355878"/><text x="828" y="202" fill="#9bb6d1" font-family="Arial,sans-serif" font-size="15">NETWORK THROUGHPUT</text><text x="828" y="254" fill="#eff6ff" font-family="Arial,sans-serif" font-size="36" font-weight="700">1.8 GB/s</text><text x="828" y="280" fill="#8ea9c4" font-family="Arial,sans-serif" font-size="13">Ingress + egress</text></g>
<!-- metrics chart -->
<rect x="70" y="335" width="690" height="330" rx="13" fill="#142a42" stroke="#355878"/><text x="100" y="377" fill="#eaf3ff" font-family="Arial,sans-serif" font-size="19" font-weight="700">Resource utilization</text><text x="100" y="404" fill="#8fa9c4" font-family="Arial,sans-serif" font-size="13">CPU usage · last 60 minutes</text>
<path d="M100 590H720M100 530H720M100 470H720M100 410H720" stroke="#54718e" stroke-opacity=".35" stroke-dasharray="5 7"/>
<path d="M100 557 C150 530 180 550 225 510 S300 520 345 480 S420 495 465 466 S535 478 580 438 S650 455 720 420" fill="none" stroke="#63b1ff" stroke-width="5" stroke-linecap="round"/>
<path d="M100 557 C150 530 180 550 225 510 S300 520 345 480 S420 495 465 466 S535 478 580 438 S650 455 720 420 L720 610 L100 610Z" fill="#2a78c2" opacity=".13"/>
<text x="100" y="638" fill="#7896b4" font-family="Arial,sans-serif" font-size="12">-60m</text><text x="680" y="638" fill="#7896b4" font-family="Arial,sans-serif" font-size="12">NOW</text>
<!-- right status -->
<rect x="795" y="335" width="335" height="330" rx="13" fill="#142a42" stroke="#355878"/><text x="825" y="377" fill="#eaf3ff" font-family="Arial,sans-serif" font-size="19" font-weight="700">Service status</text>
<g font-family="Arial,sans-serif"><circle cx="832" cy="430" r="6" fill="#55d4a1"/><text x="852" y="436" fill="#dceafa" font-size="16">API Gateway</text><text x="1083" y="436" fill="#63d6a8" font-size="13" text-anchor="end">OK</text><path d="M825 455H1100" stroke="#3a536d"/><circle cx="832" cy="490" r="6" fill="#55d4a1"/><text x="852" y="496" fill="#dceafa" font-size="16">Compute cluster</text><text x="1083" y="496" fill="#63d6a8" font-size="13" text-anchor="end">OK</text><path d="M825 515H1100" stroke="#3a536d"/><circle cx="832" cy="550" r="6" fill="#55d4a1"/><text x="852" y="556" fill="#dceafa" font-size="16">Data services</text><text x="1083" y="556" fill="#63d6a8" font-size="13" text-anchor="end">OK</text></g>
<text x="70" y="713" fill="#7894af" font-family="Arial,sans-serif" font-size="13">Illustration de supervision fictive · Indicateurs non connectés à une infrastructure réelle</text>
